services:
  sqlmesh-db:
    image: mariadb:10.11.7
    restart: "unless-stopped"
    command: "mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: openmrs
      MYSQL_PASSWORD: openmrs
      MYSQL_ROOT_PASSWORD: openmrs
    volumes:
      - db-data:/var/lib/mysql
      - ./omrs-db:/docker-entrypoint-initdb.d
    networks:
      - ohdsi-network

  omop-db:
    image: ghcr.io/ohdsi/omop-etl-deepdive-db:latest
    container_name: omop-db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pass
    ports:
      - "5432:5432"
    networks:
      - ohdsi-network

  core:
    build: core
    container_name: core
    environment:
      SRC_HOST: sqlmesh-db
      SRC_PORT: 3306
      SRC_USER: openmrs
      SRC_PASS: openmrs
      SRC_DB: openmrs
      SQLMESH_DB_ROOT_PASSWORD: openmrs
      TARGET_HOST: omop-db
      TARGET_PORT: 5432
      TARGET_USER: postgres
      TARGET_PASS: postgres_pass
      TARGET_DB: postgres
      ACHILLES_VOCAB_SCHEMA: public
      ACHILLES_RESULTS_SCHEMA: cdm_results
    depends_on:
      - sqlmesh-db
      - omop-db
    ports:
      - "8005:8000"
    networks:
      - ohdsi-network

    volumes:
      - ./concepts:/concepts
      # Uncomment the following line during development to mount local files and see changes without rebuilding the image.
      # Note: This will override files copied into /core during build.
      # - so be sure your local files are complete.
      - ./core:/core

  r-runner:
    build: ./r-runner
    container_name: omop-r-runner
    restart: unless-stopped
    ports:
      - "8001:8001"   # Plumber API port
    environment:
      TARGET_DB_HOST: omop-db
      TARGET_DB_PORT: 5432
      TARGET_DB_USER: postgres
      TARGET_DB_PASSWORD: postgres_pass
      TARGET_DB_NAME: postgres
      CDM_SCHEMA: public
      VOCAB_SCHEMA: public
      RESULTS_SCHEMA: cdm_results
      RESULTS_DIR: /results
      CDM_SOURCE_NAME: "OMRS"
      SHINY_HOST: 0.0.0.0
      SHINY_PORT: 3000
      SHINY_SERVER_BASE_PATH: /dqd
    depends_on:
      - omop-db
    volumes:
      - dqd_results:/results
    networks:
      - ohdsi-network

  ares:
    image: ghcr.io/omop-bridge/ares:sha-21d4e88
    container_name: ohdsi-ares
    restart: unless-stopped
    ports:
      - "81:80"
    volumes:
      - dqd_results:/usr/share/nginx/html/ares/data
      - dqd_results:/usr/share/nginx/html/data
    networks:
      - ohdsi-network


  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    restart: unless-stopped
    ports:
      - "8978:8978" # Web UI exposed on http://localhost:8978
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
    networks:
      - ohdsi-network

volumes:
  db-data: ~
  cloudbeaver-data: ~
  dqd_results:

networks:
  ohdsi-network:
    name: etl-ohdsi-network
    driver: bridge