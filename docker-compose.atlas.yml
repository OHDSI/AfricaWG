services:
  webapi:
    image: docker.io/ohdsi/webapi:latest
    container_name: webapi
    restart: on-failure
    secrets:
      - WEBAPI_DATASOURCE_PASSWORD
      - SECURITY_LDAP_SYSTEM_PASSWORD
      - SECURITY_DB_DATASOURCE_PASSWORD
      - SECURITY_AD_SYSTEM_PASSWORD
      - SECURITY_OAUTH_GOOGLE_APISECRET
      - SECURITY_OAUTH_FACEBOOK_APISECRET
      - SECURITY_OAUTH_GITHUB_APISECRET
      - SECURITY_SAML_KEYMANAGER_STOREPASSWORD
      - SECURITY_SAML_KEYMANAGER_PASSWORDS_ARACHNENETWORK
      - WEBAPI_CDM_SNOWFLAKE_PRIVATE_KEY
    ports:
      - "8280:8080"
    env_file:
      - ./atlas/.env
    networks:
      - ohdsi-network
    volumes:
      - ${WEBAPI_ADDITIONAL_JDBC_FILE_PATH}:/var/lib/ohdsi/webapi/lib/additional/broadsea_mounted.jar
      - ./webapi/docker-entrypoint.sh:/entrypoint.sh
    entrypoint: [ "/bin/sh","/entrypoint.sh" ]
    environment:
      # --- Existing Core Environment Variables ---
      CLASSPATH: ":/var/lib/ohdsi/webapi/lib/additional/broadsea_mounted.jar"
      DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      DATASOURCE_URL: ${WEBAPI_DATASOURCE_URL}
      DATASOURCE_USERNAME: ${WEBAPI_DATASOURCE_USERNAME}
      DATASOURCE_OHDSI_SCHEMA: ${WEBAPI_DATASOURCE_OHDSI_SCHEMA}
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${WEBAPI_DATASOURCE_OHDSI_SCHEMA}
      SPRING_BATCH_REPOSITORY_TABLEPREFIX: ${WEBAPI_DATASOURCE_OHDSI_SCHEMA}.BATCH_

      # --- Flyway Core Migrations ---
      FLYWAY_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      FLYWAY_DATASOURCE_URL: ${WEBAPI_DATASOURCE_URL}
      FLYWAY_DATASOURCE_USERNAME: ${WEBAPI_DATASOURCE_USERNAME}
      FLYWAY_LOCATIONS: classpath:db/migration/postgresql
      FLYWAY_PLACEHOLDERS_OHDSISCHEMA: ${WEBAPI_DATASOURCE_OHDSI_SCHEMA}
      FLYWAY_SCHEMAS: ${WEBAPI_DATASOURCE_OHDSI_SCHEMA}
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_TABLE: schema_history
      flyway_baselineVersionAsString: "2.2.5.20180212152023"
      FLYWAY_BASELINEDESCRIPTION: Base Migration

      # --- ADD THESE MISSING SECURITY MIGRATION VARIABLES ---
      SECURITY_DB_MIGRATION_ENABLED: "true"
      SECURITY_DB_MIGRATION_SCHEMA: ${SECURITY_DB_DATASOURCE_SCHEMA}
      FLYWAY_PLACEHOLDERS_SECURITYSCHEMA: ${SECURITY_DB_DATASOURCE_SCHEMA}

      # --- Security Provider & Basic Settings ---
      SECURITY_CORS_ENABLED: "true"
      SECURITY_ORIGIN: "*"
      SECURITY_PROVIDER: ${WEBAPI_SECURITY_PROVIDER}
      SECURITY_TOKEN_EXPIRATION: ${SECURITY_TOKEN_EXPIRATION}

    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/WebAPI/info || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  webapi-init:
    image: postgres:16-alpine
    container_name: omop-webapi-init
    depends_on:
      webapi:
        condition: service_healthy   # Waits until WebAPI health check is completely passing
    volumes:
      - ./webapi/post-webapi-ddl:/scripts
    command: >
      sh -c "echo 'WebAPI is up and healthy. Executing post-startup SQL scripts from /scripts...' &&
             until pg_isready -h omop-db -p 5432 -U postgres; do sleep 2; done &&
             for f in /scripts/*.sql; do
               if [ -f \"$$f\" ]; then
                 echo 'Running script: $$f' &&
                 psql postgresql://postgres:postgres_pass@omop-db:5432/postgres -f \"$$f\" || exit 1;
               fi;
             done &&
             echo 'All post-webapi-ddl scripts executed successfully!'"
    networks:
      - ohdsi-network

  atlas:
    image: ohdsi/atlas:latest
    container_name: atlas
    env_file:
      - ./atlas/.env
    ports:
      - "8180:8080"
    environment:
      WEBAPI_URL: http://localhost:8280/WebAPI
      ATLAS_INSTANCE_NAME: ${ATLAS_INSTANCE_NAME}
      ATLAS_COHORT_COMPARISON_RESULTS_ENABLED: ${ATLAS_COHORT_COMPARISON_RESULTS_ENABLED}
      ATLAS_USER_AUTH_ENABLED: ${ATLAS_USER_AUTH_ENABLED}
      ATLAS_PLP_RESULTS_ENABLED: ${ATLAS_PLP_RESULTS_ENABLED}
      ATLAS_SECURITY_PROVIDER_NAME: ${ATLAS_SECURITY_PROVIDER_NAME}
      ATLAS_SECURITY_PROVIDER_TYPE: ${ATLAS_SECURITY_PROVIDER_TYPE}
      ATLAS_SECURITY_ICON: ${ATLAS_SECURITY_ICON}
      ATLAS_SECURITY_USE_FORM: ${ATLAS_SECURITY_USE_FORM}
      ATLAS_SECURITY_USE_AJAX: ${ATLAS_SECURITY_USE_AJAX}
      ATLAS_DISABLE_BROWSER_CHECK: ${ATLAS_DISABLE_BROWSER_CHECK}
      ATLAS_USE_EXECUTION_ENGINE: ${ATLAS_USE_EXECUTION_ENGINE}
      ATLAS_ENABLE_TAGGING_SECTION: ${ATLAS_ENABLE_TAGGING_SECTION}
      ATLAS_CACHE_SOURCES: ${ATLAS_CACHE_SOURCES}
      ATLAS_POLL_INTERVAL: ${ATLAS_POLL_INTERVAL}
      ATLAS_ENABLE_SKIP_LOGIN: ${ATLAS_ENABLE_SKIP_LOGIN}
      ATLAS_VIEW_PROFILE_DATES: ${ATLAS_VIEW_PROFILE_DATES}
      ATLAS_ENABLE_COSTS: ${ATLAS_ENABLE_COSTS}
      ATLAS_SUPPORT_URL: ${ATLAS_SUPPORT_URL}
      ATLAS_SUPPORT_MAIL: ${ATLAS_SUPPORT_MAIL}
      ATLAS_FEEDBACK_CONTACTS: ${ATLAS_FEEDBACK_CONTACTS}
      ATLAS_FEEDBACK_CUSTOM_HTML_TEMPLATE: ${ATLAS_FEEDBACK_CUSTOM_HTML_TEMPLATE}
      ATLAS_COMPANY_INFO_CUSTOM_HTML_TEMPLATE: ${ATLAS_COMPANY_INFO_CUSTOM_HTML_TEMPLATE}
      ATLAS_SHOW_COMPANY_INFO: ${ATLAS_SHOW_COMPANY_INFO}
      ATLAS_DEFAULT_LOCALE: ${ATLAS_DEFAULT_LOCALE}
      ATLAS_ENABLE_PERSON_COUNT: ${ATLAS_ENABLE_PERSON_COUNT}
      ATLAS_ENABLE_TERMS_AND_CONDITIONS: ${ATLAS_ENABLE_TERMS_AND_CONDITIONS}

    volumes:
      - ./atlas/config/config-local-template.js:/tmp/config-local.js:ro
      - ./atlas/config/envsubst.sh:/tmp/envsubst.sh:ro
      - ./atlas/config/config-gis.js:/usr/share/nginx/html/atlas/js/config-gis.js:ro
    entrypoint: [ "sh", "/tmp/envsubst.sh" ]
    depends_on:
      - webapi
    networks:
      - ohdsi-network

networks:
  ohdsi-network:
    name: etl-ohdsi-network
    external: true

secrets:
  GITHUB_PAT:
    file: ${GITHUB_PAT_SECRET_FILE}
  CDM_CONNECTIONDETAILS_PASSWORD:
    file: ${CDM_CONNECTIONDETAILS_PASSWORD_FILE}
  WEBAPI_DATASOURCE_PASSWORD:
    file: ${WEBAPI_DATASOURCE_PASSWORD_FILE}
  SECURITY_LDAP_SYSTEM_PASSWORD:
    file: ${SECURITY_LDAP_SYSTEM_PASSWORD_FILE}
  SECURITY_DB_DATASOURCE_PASSWORD:
    file: ${SECURITY_DB_DATASOURCE_PASSWORD_FILE}
  SECURITY_AD_SYSTEM_PASSWORD:
    file: ${SECURITY_AD_SYSTEM_PASSWORD_FILE}
  SECURITY_OAUTH_GOOGLE_APISECRET:
    file: ${SECURITY_OAUTH_GOOGLE_APISECRET_FILE}
  SECURITY_OAUTH_FACEBOOK_APISECRET:
    file: ${SECURITY_OAUTH_FACEBOOK_APISECRET_FILE}
  SECURITY_OAUTH_GITHUB_APISECRET:
    file: ${SECURITY_OAUTH_GITHUB_APISECRET_FILE}
  SECURITY_SAML_KEYMANAGER_STOREPASSWORD:
    file: ${SECURITY_SAML_KEYMANAGER_STOREPASSWORD_FILE}
  SECURITY_SAML_KEYMANAGER_PASSWORDS_ARACHNENETWORK:
    file: ${SECURITY_SAML_KEYMANAGER_PASSWORDS_ARACHNENETWORK_FILE}
  WEBAPI_CDM_SNOWFLAKE_PRIVATE_KEY:
    file: ${WEBAPI_CDM_SNOWFLAKE_PRIVATE_KEY_FILE}