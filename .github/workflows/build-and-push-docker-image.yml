# Build Docker image and push to GitHub Container Registry (GHCR)
name: build-and-push-ghcr-image

on:
  push:
    tags:
      - 'v*'
    branches:
      - deep-dive-db
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: false
        default: "deep-dive-db"
      version_tag:
        description: "Custom Image Tag (e.g., 1.0.0.1) - Leave blank to use defaults"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          lfs: true

      - name: Fetch Git LFS files
        run: git lfs pull

      - name: Lowercase Repository Name
        id: string
        run: |
          # GHCR strictly requires lowercase owner/repository names
          echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/omop-etl-deepdive-db' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Always tag as 'latest' for pushes and manual dispatches
            type=raw,value=latest
            # Generate semver tag on git tag pushes (e.g., v1.0.0)
            type=semver,pattern={{version}}
            # Generate custom version tag if provided in workflow_dispatch
            type=raw,value=${{ github.event.inputs.version_tag }},enable=${{ github.event.inputs.version_tag != '' }}
            # Generate branch name tag (e.g., deep-dive-db)
            type=ref,event=branch

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          build-args: |
            PASSWORD_METHOD=default
            GIT_BRANCH=${{ github.event.inputs.branch || github.ref_name }}
            GIT_COMMIT_ID_ABBREV=${{ github.sha }}

      - name: Log generated Docker image tags
        run: |
          echo "Successfully pushed to: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Generated tags:"
          echo "${{ steps.meta.outputs.tags }}"
